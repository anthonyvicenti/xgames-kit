skip-lint = false

[programs.localnet]
loot = "GVzbAquLbqGxWzzjEAYvGyj1a3SHEcBr3gM9fseTg73o"

[programs.devnet]
loot = "GVzbAquLbqGxWzzjEAYvGyj1a3SHEcBr3gM9fseTg73o"

# Deploys go through `solana program deploy` with explicit --url devnet (see README);
