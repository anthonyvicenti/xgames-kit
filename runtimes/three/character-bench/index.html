<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character bench</title>
<style>
  :root { --bg: #e9eef5; --panel: #ffffffe6; --ink: #1d2230; --muted: #5b6475; --accent: #ff6f9c; --line: #d5dbe6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 12px; box-shadow: 0 6px 24px #1d22301a; backdrop-filter: blur(6px); }
  #ui h1 { font-size: 14px; margin: 0 0 8px; }
  #ui h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  #ui select, #ui input[type=range] { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .clips { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  @media (max-width: 600px) { #ui { width: auto; right: 12px; max-height: 42%; } }
</style>
<script>window.__GF_ASSET_OVERRIDES = window.__GF_ASSET_OVERRIDES || { files: {}, patches: [] };</script>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "@dimforge/rapier3d-compat": "/vendor/rapier/rapier.mjs"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>gf-humanoid-1 character bench</h1>
  <h2>Body</h2>
  <select id="body"></select>
  <div class="row"><label>Tint</label><input id="tint" type="color" value="#ff7eb3"><button id="sockets">Sockets</button></div>
  <h2>Move</h2>
  <div class="row"><input id="speed" type="range" min="0" max="7" step="0.1" value="0"><span id="speedv">0.0</span>&nbsp;m/s</div>
  <div class="row"><button id="jump">Jump</button><button id="knock">Knock</button><button id="aimbtn">Aim</button><button id="carrybtn">Carry</button></div>
  <h2>Clips</h2>
  <div class="clips" id="clips"></div>
  <h2>Scene</h2>
  <div class="row"><button id="single" class="on">One</button><button id="lineup">Line-up of 4</button><button id="all">All bodies</button></div>
  <div id="status">loading…</div>
</div>
<script type="module" src="./bench.js"></script>
</body>
</html>
