<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kind sheet</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #14151a; --panel: #1d1f26; --ink: #eceae4; --dim: #a7a49b; --rule: #33363f; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 24px; display: grid; gap: 24px; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 8px 32px; align-items: end; border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
    h1 { margin: 0; font-size: 44px; letter-spacing: -.01em; }
    h1 small { font-size: 18px; color: var(--dim); font-weight: 500; margin-left: 14px; letter-spacing: 0; }
    .feel { grid-column: 1 / -1; font-size: 17px; max-width: 120ch; margin: 0; }
    .refs { font-size: 15px; color: var(--dim); }
    .refs b { color: var(--ink); font-weight: 600; }
    .meta { text-align: right; color: var(--dim); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, var(--tw)); gap: 24px; }
    figure { margin: 0; background: var(--panel); border-radius: 6px; overflow: hidden; }
    figure img { display: block; width: var(--tw); height: var(--th); object-fit: cover; }
    figure img.px { image-rendering: pixelated; }
    figcaption { padding: 8px 12px; font-size: 14px; color: var(--dim); display: flex; justify-content: space-between; gap: 12px; }
    figcaption b { color: var(--ink); font-weight: 600; }
    .card { width: var(--tw); height: calc(var(--th) + 37px); box-sizing: border-box; padding: 22px 26px; background: var(--panel); border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; align-content: start; font-size: 15px; }
    .card h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
    .card p { margin: 0; }
    .card .wide { grid-column: 1 / -1; }
    .sw { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .sw i { width: 26px; height: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px #fff3; display: inline-block; }
    .tag { display: inline-block; padding: 1px 8px; margin: 0 4px 4px 0; border-radius: 999px; background: #2a2d36; font-size: 13px; }
    .state { font-weight: 600; } .state.proven { color: #8fd18a; } .state.exists { color: #e8c96a; } .state.partly { color: #e8a36a; } .state.to-prove { color: var(--dim); }
  </style>
</head>
<body>
  <main id="m"></main>
  <script type="module" src="./compose.js"></script>
</body>
</html>
